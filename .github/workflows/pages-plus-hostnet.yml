name: Pages preview → Hostnet deploy (FTP clean)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

env:
  SERVER_DIR: "/customers/3/b/0/cebjgz0mr/webroots/sites/groei-sterker.nl/"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full history for commit summary)
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # (OPTIONEEL) Webhook test: laat zien of Discord 204/403/404 geeft.
      # Verwijder later als het werkt.
      - name: Discord — Webhook test (debug)
        continue-on-error: true
        run: |
          echo "Testing Discord webhook..."
          curl -i -H "Content-Type: application/json" -X POST \
            -d '{"content":"GitHub Actions ✅"}' \
            "${{ secrets.DISCORD_WEBHOOK }}"

      - name: Discord — Deploys gestart (met commit summary)
        continue-on-error: true
        run: |
          CHANGES=$(git log -5 --pretty=format:"• %s" | sed ':a;N;$!ba;s/\n/\\n/g')
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

          curl -H "Content-Type: application/json" -X POST \
            -d "{
              \"embeds\": [{
                \"title\": \"🚀 Deploys — Gestart\",
                \"description\": \"**Wijzigingen (laatste 5 commits):**\\n$CHANGES\\n\\nRepo: ${{ github.repository }}\\nBranch: ${{ github.ref_name }}\\nRun: $RUN_URL\",
                \"color\": 3447003
              }]
            }" \
            "${{ secrets.DISCORD_WEBHOOK }}"

      - name: Prepare clean deploy folder (exclude junk)
        run: |
          mkdir -p deploy
          rsync -av \
            --delete \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='.gitignore' \
            --exclude='.gitattributes' \
            --exclude='.nojekyll' \
            --exclude='README.md' \
            --exclude='LICENSE' \
            --exclude='INSTALL.txt' \
            --exclude='project.mobirise' \
            --exclude='publish-hashes.json' \
            --exclude='Groei-Sterker/' \
            --exclude='history/' \
            --exclude='assets/models/' \
            --exclude='.vscode/' \
            --exclude='.idea/' \
            --exclude='node_modules/' \
            --exclude='**/*.psd' \
            --exclude='**/*.ai' \
            --exclude='**/*.kra' \
            --exclude='**/*.xcf' \
            --exclude='**/*.map' \
            ./ deploy/
          # De preview op GitHub Pages hoort niet in Google: alleen die kopie krijgt noindex, groei-sterker.nl niet
          rsync -a deploy/ pages/
          find pages -name '*.html' -exec sed -i 's#<head>#<head>\n  <meta name="robots" content="noindex, nofollow">#' {} +

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: pages

      - name: Upload CI artifact
        uses: actions/upload-artifact@v7
        with:
          name: site-dist
          path: deploy
          # anders gaat .htaccess (https, beveiligingsheaders) niet mee naar Hostnet
          include-hidden-files: true

  deploy_pages:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout (full history for commit summary)
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

      - name: Discord — Deploys — GitHub Pages geslaagd (met commit summary)
        if: success()
        continue-on-error: true
        run: |
          CHANGES=$(git log -5 --pretty=format:"• %s" | sed ':a;N;$!ba;s/\n/\\n/g')
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          PAGE_URL="${{ steps.deployment.outputs.page_url }}"

          curl -H "Content-Type: application/json" -X POST \
            -d "{
              \"embeds\": [{
                \"title\": \"🚀 Deploys — GitHub Pages geslaagd\",
                \"description\": \"Pages URL: $PAGE_URL\\n\\n**Wijzigingen (laatste 5 commits):**\\n$CHANGES\\n\\nRun: $RUN_URL\",
                \"color\": 3066993
              }]
            }" \
            "${{ secrets.DISCORD_WEBHOOK }}"

      - name: Discord — Deploys — GitHub Pages gefaald
        if: failure()
        continue-on-error: true
        run: |
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          curl -H "Content-Type: application/json" -X POST \
            -d "{
              \"embeds\": [{
                \"title\": \"🚀 Deploys — GitHub Pages gefaald\",
                \"description\": \"Run: $RUN_URL\",
                \"color\": 15158332
              }]
            }" \
            "${{ secrets.DISCORD_WEBHOOK }}"

  deploy_hostnet:
    needs: deploy_pages
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout (full history for commit summary)
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Download build artifact
        uses: actions/download-artifact@v8
        with:
          name: site-dist
          path: site

      - name: Discord — Deploys — Hostnet gestart (met commit summary)
        continue-on-error: true
        run: |
          CHANGES=$(git log -5 --pretty=format:"• %s" | sed ':a;N;$!ba;s/\n/\\n/g')
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

          curl -H "Content-Type: application/json" -X POST \
            -d "{
              \"embeds\": [{
                \"title\": \"🚀 Deploys — Hostnet gestart\",
                \"description\": \"Site: groei-sterker.nl\\nServer dir: ${{ env.SERVER_DIR }}\\n\\n**Wijzigingen (laatste 5 commits):**\\n$CHANGES\\n\\nRun: $RUN_URL\",
                \"color\": 3447003
              }]
            }" \
            "${{ secrets.DISCORD_WEBHOOK }}"

      # FTP over TLS (FTPS): het FTP-wachtwoord gaat versleuteld over internet.
      # Met lftp, omdat FTP-Deploy-Action bij FTPS de servernaam (SNI) niet meestuurt en Hostnet dan de TLS-verbinding weigert.
      # SFTP_HOST moet daarom de hostnaam zijn (ftp.cebjgz0mr.service.one), geen IP-adres.
      # De junk-bestanden zijn al weggelaten bij "Prepare clean deploy folder".
      - name: FTPS deploy to Hostnet
        env:
          FTP_HOST: ${{ secrets.SFTP_HOST }}
          FTP_USER: ${{ secrets.SFTP_USER }}
          LFTP_PASSWORD: ${{ secrets.SFTP_PASSWORD }}
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq lftp
          TLS="set ftp:ssl-force true; set ftp:ssl-protect-data true; set ssl:verify-certificate true; set net:max-retries 2; set net:timeout 30;"
          # Staat er op de server een .htaccess die niet uit git komt, dan bewaren we die eerst als back-up.
          # De naam begint met .ht, dus de server geeft hem niet aan bezoekers. In de log alleen de soorten regels, niet de inhoud.
          mkdir -p bestaand
          lftp --env-password -u "$FTP_USER" "$FTP_HOST" -e "$TLS set cmd:fail-exit false; get -O bestaand $SERVER_DIR.htaccess; bye" || true
          if [ -s bestaand/.htaccess ] && ! cmp -s bestaand/.htaccess site/.htaccess; then
            BACKUP=".htaccess-voor-git-$(date +%Y%m%d-%H%M%S)"
            echo "Bestaande .htaccess op de server bewaard als $BACKUP. Soorten regels:"
            grep -vE '^[[:space:]]*(#|$)' bestaand/.htaccess | awk '{print $1}' | sort | uniq -c
            lftp --env-password -u "$FTP_USER" "$FTP_HOST" -e "$TLS set cmd:fail-exit true; put bestaand/.htaccess -o $SERVER_DIR$BACKUP; bye"
          fi
          lftp --env-password -u "$FTP_USER" "$FTP_HOST" -e "
            $TLS set cmd:fail-exit true;
            mirror -R --verbose --parallel=4 site/ $SERVER_DIR;
            rm -f $SERVER_DIR.ftp-deploy-sync-state.json;
            bye"

      - name: Discord — Deploys — Hostnet geslaagd (met commit summary)
        if: success()
        continue-on-error: true
        run: |
          CHANGES=$(git log -5 --pretty=format:"• %s" | sed ':a;N;$!ba;s/\n/\\n/g')
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

          curl -H "Content-Type: application/json" -X POST \
            -d "{
              \"embeds\": [{
                \"title\": \"🚀 Deploys — Geslaagd\",
                \"description\": \"Hostnet update voltooid ✅\\n\\n**Wijzigingen (laatste 5 commits):**\\n$CHANGES\\n\\nRun: $RUN_URL\",
                \"color\": 3066993
              }]
            }" \
            "${{ secrets.DISCORD_WEBHOOK }}"

      - name: Discord — Deploys — Hostnet gefaald (met commit summary)
        if: failure()
        continue-on-error: true
        run: |
          CHANGES=$(git log -5 --pretty=format:"• %s" | sed ':a;N;$!ba;s/\n/\\n/g')
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

          curl -H "Content-Type: application/json" -X POST \
            -d "{
              \"embeds\": [{
                \"title\": \"🚀 Deploys — Gefaald\",
                \"description\": \"Hostnet deploy faalde ❌\\n\\n**Wijzigingen (laatste 5 commits):**\\n$CHANGES\\n\\nRun: $RUN_URL\",
                \"color\": 15158332
              }]
            }" \
            "${{ secrets.DISCORD_WEBHOOK }}"
